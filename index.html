    <meta charset="UTF-8" />
    <script>
      (function () {
        // Prevent "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, "fetch", {
            configurable: true,
            enumerable: true,
            get: function () {
              return _origFetch;
            },
            set: function (fn) {
              _origFetch = fn;
            },
          });
        } catch (e) {
          try {
            if (typeof Window !== "undefined" && Window.prototype) {
              var _protoFetch = Window.prototype.fetch;
              Object.defineProperty(Window.prototype, "fetch", {
                configurable: true,
                enumerable: true,
                get: function () {
                  return _protoFetch;
                },
                set: function (fn) {
                  _protoFetch = fn;
                },
              });
            }
          } catch (err) {}
        }
        window.addEventListener(
          "error",
          function (e) {
            if (
              e &&
              e.message &&
              e.message.indexOf("Cannot set property fetch of") !== -1
            ) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          },
          true,
        );
      })();
    </script>
